          command: git clone --depth 1 --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress and stage
          command: tar -xjf ci-bundle.tar.bz2
      - run:
          name: Settle filesystem
          command: g++ --version
      - run:
          name: Package artifacts
